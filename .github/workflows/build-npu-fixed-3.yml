name: Build NPU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build-npu-fixed-3.yml'

permissions:
  contents: read

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signing secrets (fail fast)
        shell: bash
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in BMOE_KEYSTORE_BASE64 BMOE_KEYSTORE_PASSWORD BMOE_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "ERROR: GitHub secret $v is not set. Add the signing secrets before building (see docs/SIGNING.md)." >&2
              exit 1
            fi
          done

      # GitHub-hosted Ubuntu runners have limited free disk. The Hexagon SDK
      # container plus native build tree and Android NDK can exhaust it.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$AVAIL_KB" -lt 8000000 ]; then
            echo "ERROR: Less than 8 GB free after cleanup; refusing a likely disk-exhausting build."
            exit 1
          fi

      - name: Locate project source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f scripts/build-hexagon-onedge-engine.sh ]; then
            # Project is already unpacked at the repository root.
            PROJECT_ROOT="."
            echo "Using project at repository root"
          else
            # Project is shipped as a single ZIP at the repository root (any file name).
            mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)
            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one source ZIP at repository root, found ${#ZIPS[@]}:"
              printf '  %s\n' "${ZIPS[@]}"
              exit 1
            fi
            ZIP_FILE="${ZIPS[0]}"
            echo "Source ZIP: $ZIP_FILE"
            unzip -t "$ZIP_FILE" >/dev/null
            mkdir -p project
            unzip -q "$ZIP_FILE" -d project
            WRAPPER="$(find project -maxdepth 8 -type f -name gradlew -print -quit)"
            test -n "$WRAPPER" || { echo "ERROR: gradlew not found in source ZIP"; exit 1; }
            PROJECT_ROOT="$(dirname "$WRAPPER")"
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Source root: $PROJECT_ROOT"
          for f in scripts/build-hexagon-onedge-engine.sh scripts/verify-npu-payload.sh; do
            test -f "$PROJECT_ROOT/$f" || { echo "ERROR: source does not contain $f"; exit 1; }
          done

      - name: Build JNI engine and Hexagon DSP libraries
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/snapdragon-toolchain/arm64-android:v0.8'
          cleanup_native_space() {
            # Docker's default user creates root-owned CMake files on this bind mount.
            sudo rm -rf -- "$PROJECT_ROOT/build-hexagon-onedge" || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
            docker system prune --force --volumes >/dev/null 2>&1 || true
            echo "Disk at native-build exit:"
            df -h / || true
          }
          trap cleanup_native_space EXIT
          docker run --rm \
            -e OUT=/workspace/build-hexagon-onedge \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -v "$PWD/$PROJECT_ROOT:/workspace" \
            "$IMAGE" bash /workspace/scripts/build-hexagon-onedge-engine.sh
          echo "Disk after native build:"
          df -h /
          # Native CMake intermediates and the large toolchain image are removed
          # by cleanup_native_space, even when the native build fails.

      - name: Verify staged NPU libraries
        shell: bash
        run: |
          set -euo pipefail
          bash "$PROJECT_ROOT/scripts/verify-npu-payload.sh" \
            "$PROJECT_ROOT/app/src/main/jniLibs/arm64-v8a" \
            "$PROJECT_ROOT/app/src/main/assets/hexagon" | tee npu-payload-verification.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Avoid a duplicate Gradle cache on the space-constrained hosted runner.
          # cache intentionally disabled for this NPU build.

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
          echo "Disk after Android SDK setup:"
          df -h /

      - name: Decode release signing keystore
        shell: bash
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in BMOE_KEYSTORE_BASE64 BMOE_KEYSTORE_PASSWORD BMOE_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "ERROR: GitHub secret $v is not set. Refusing to build with a throwaway debug key (see docs/SIGNING.md)." >&2
              exit 1
            fi
          done
          KS="$RUNNER_TEMP/bmoe-release.jks"
          printf '%s' "$BMOE_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "BMOE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build NPU-enabled APK
        shell: bash
        env:
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
          BMOE_KEY_PASSWORD: ${{ secrets.BMOE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug -PbmoePrebuiltNative=true -PbmoeRequireStableSigning=true
          echo "Disk after Gradle build:"
          df -h /

      - name: Verify APK actually packages the NPU payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERROR: APK not produced: $APK"; exit 1; }
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/jni" "$TMP/hexagon"
          for f in libonedge-engine.so libc++_shared.so; do
            unzip -p "$APK" "lib/arm64-v8a/$f" > "$TMP/jni/$f" || {
              echo "ERROR: APK is missing lib/arm64-v8a/$f"; exit 1;
            }
          done
          for f in libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -p "$APK" "assets/hexagon/$f" > "$TMP/hexagon/$f" || {
              echo "ERROR: APK is missing assets/hexagon/$f"; exit 1;
            }
          done
          bash "$PROJECT_ROOT/scripts/verify-npu-payload.sh" "$TMP/jni" "$TMP/hexagon" | tee -a npu-payload-verification.txt
          sha256sum "$APK" | tee -a npu-payload-verification.txt

      - name: Verify APK signing certificate
        shell: bash
        env:
          BMOE_EXPECTED_CERT_SHA256: ${{ secrets.BMOE_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/35.0.0/apksigner)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a npu-payload-verification.txt
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL" || { echo "ERROR: could not read signing certificate" >&2; exit 1; }
          if [ "$ACTUAL" = "bac3895da611bae70c470e1a837077e50bb6db4e9f86bcf267c430634885beb1" ]; then
            echo "ERROR: APK is signed with the old throwaway CI debug certificate (the v0.5.5 one)." >&2; exit 1
          fi
          if [ -n "${BMOE_EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$BMOE_EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: certificate $ACTUAL != expected $EXPECTED" >&2; exit 1; }
          fi
          echo "Signing certificate SHA-256: $ACTUAL" | tee -a npu-payload-verification.txt

      - name: Upload NPU APK
        uses: actions/upload-artifact@v4
        with:
          name: onedge-npu-debug-apk
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
            npu-payload-verification.txt
          if-no-files-found: error
          retention-days: 7
          

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "${BMOE_KEYSTORE_FILE:-/nonexistent}" || true
