name: Build (Rust)

# Put this file at: .github/workflows/build.yml
# The repo root must contain Cargo.toml and crates/ (the unzipped Rust project),
# NOT a zip file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------- Desktop: format, test, release binary (for benchmarking) ----------
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, edition 2024 needs >= 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: System libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev \
            libssl-dev pkg-config cmake clang

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true   # code is not fully formatted yet; remove once clean

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true   # remove once clean

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p bmoe-app

      - uses: actions/upload-artifact@v4
        with:
          name: bmoe-app-linux-x86_64
          path: target/release/bmoe-app
          if-no-files-found: error

  # ---------- Android APK (experimental, never verified on a device) ----------
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Set up Android SDK/NDK paths (preinstalled on ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Prepare release keystore
        # Uses your secrets if present; otherwise a throwaway test key
        # (fine for testing, NOT for publishing).
        env:
          KS_B64: ${{ secrets.BMOE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "Using keystore from secrets"
          else
            PASS="android-test-pass"
            keytool -genkey -v -keystore "$KS" -alias bmoe -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=BMoE Test,O=Test,C=US" >/dev/null 2>&1
            echo "Using throwaway test keystore"
          fi
          echo "::add-mask::$PASS"
          echo "CARGO_APK_RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        run: cargo apk build --release -p bmoe-app

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: BigMoeOnEdgeRust-apk
          path: target/release/apk/*.apk
          if-no-files-found: error
