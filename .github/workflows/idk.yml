
name: Complete Repository Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove everything except workflows
        run: |
          # Remove everything in repository root except .git and .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Remove everything inside .github except workflows
          find .github -mindepth 1 -maxdepth 1 \
            ! -name 'workflows' \
            -exec rm -rf -- {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Complete repository cleanup" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
          
