
name: Wipe Repository Except Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete everything except workflows
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          find .github -mindepth 1 -maxdepth 1 \
            ! -name 'workflows' \
            -exec rm -rf {} +

          find .github/workflows -mindepth 1 \
            -exec rm -rf {} +

          git add -A
          git commit -m "Wipe repository except workflows" || true
          git push origin HEAD
          
