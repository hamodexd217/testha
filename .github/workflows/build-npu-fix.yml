name: Android NPU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-npu-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim runner disk and check capacity
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          # These images/toolchains are not used by this Android/Hexagon workflow.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images /usr/local/share/powershell \
            /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker system prune --all --force --volumes || true
          echo 'Disk after cleanup:'
          df -h /
          free_kb="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if [[ "$free_kb" -lt 8000000 ]]; then
            echo 'ERROR: fewer than 8 GB are free; refusing to start the Hexagon build.' >&2
            exit 1
          fi

      - name: Build JNI engine and HTP DSP skeletons
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/snapdragon-toolchain/arm64-android:v0.8'
          cleanup_native_space() {
            sudo rm -rf -- build-hexagon-onedge || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
            docker system prune --force --volumes >/dev/null 2>&1 || true
            echo 'Disk after native cleanup:'
            df -h / || true
          }
          trap cleanup_native_space EXIT
          docker run --rm \
            -e OUT=/workspace/build-hexagon-onedge \
            -e BMOE_BUILD_JOBS=2 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -v "$PWD:/workspace" \
            "$IMAGE" bash /workspace/scripts/build-hexagon-onedge-engine.sh
          # The build script has staged/verified outputs. Only intermediates and the large image are removed.
          test -s app/src/main/jniLibs/arm64-v8a/libonedge-engine.so
          test -s app/src/main/assets/hexagon/libggml-htp-v73.so

      - name: Verify staged JNI and DSP payload
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-npu-payload.sh \
            app/src/main/jniLibs/arm64-v8a app/src/main/assets/hexagon | tee npu-payload-verification.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Do not seed a second Gradle dependency cache on this disk-sensitive build.

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          echo 'Disk after Android SDK setup:'
          df -h /

      - name: Build NPU-enabled APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :app:assembleDebug -PbmoePrebuiltNative=true
          echo 'Disk after Gradle build:'
          df -h /

      - name: Verify the packaged APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "ERROR: APK not produced: $APK" >&2; exit 1; }
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/jni" "$TMP/hexagon"
          for f in libonedge-engine.so libc++_shared.so; do
            unzip -p "$APK" "lib/arm64-v8a/$f" > "$TMP/jni/$f" || {
              echo "ERROR: APK is missing lib/arm64-v8a/$f" >&2; exit 1;
            }
          done
          for f in libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -p "$APK" "assets/hexagon/$f" > "$TMP/hexagon/$f" || {
              echo "ERROR: APK is missing assets/hexagon/$f" >&2; exit 1;
            }
          done
          bash scripts/verify-npu-payload.sh "$TMP/jni" "$TMP/hexagon" | tee -a npu-payload-verification.txt
          sha256sum "$APK" | tee -a npu-payload-verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: onedge-npu-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            npu-payload-verification.txt
          if-no-files-found: error
          retention-days: 7
          
