- name: Unzip project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project

          ZIP_FILE="BigMoeOnEdge-plus-0.4.5.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          rm -rf project/.git

      - name: Install SDK, NDK, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKM" --licenses >/dev/null || true

          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

          # Retry the NDK download if the first attempt fails.
          for attempt in 1 2 3; do
            if "$SDKM" "ndk;27.0.12077973"; then
              echo "NDK installed successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: NDK installation failed after 3 attempts."
              exit 1
            fi

            echo "NDK installation failed; retrying ($attempt/3)..."
            sleep 10
          done
