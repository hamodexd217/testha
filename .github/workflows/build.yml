name: Build

# BigMoeOnEdge+ — everything this repository can build, on every platform it can build it for.
#
#   android    the app (APK, arm64-v8a, CPU) + its Kotlin unit tests
#   android-npu the same app with the Snapdragon Hexagon NPU backend (APK, arm64-v8a)
#   core-host  the engine core's policy/IO layers and their tests on Linux x64/arm64, macOS, Windows
#   desktop    upstream's bmoe-cli, bmoe-server (+ web UI) and bmoe-desktop, from ./upstream, on
#              Linux x64/arm64, macOS arm64/x64, Windows x64/arm64
#   release    on a v* tag: collects everything into one GitHub release, notes from docs/RELEASE_NOTES_<version>.md
#
# Triggers: every push to main and every pull request; a v* tag also publishes the release;
# "Run workflow" builds on demand (and can skip the slow NPU job).
#
# This file is self-contained: it needs nothing else in .github/. Layout: the project may sit unpacked at
# the repository root, or ship as one source .zip there
# (the "Locate project" step of each job). The desktop jobs need ./upstream, so they run only with the
# unpacked layout or a zip that contains it.
#
# Status: first run 2026-11-05 — core-host (4 OSes) and desktop (6 targets) green; the Android job had not yet got
# past its unit-test compile (fixed since). Jobs are independent, so a desktop failure never blocks the APK.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream BigMoeOnEdge tag whose llama.cpp/webview submodule pins the desktop jobs use"
        default: "v0.39.0"
        required: false
      npu:
        description: "Also build the NPU (Hexagon) APK. Slow: leave on unless you only need the other jobs."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'v0.39.0' }}
  UPSTREAM_REPO: https://github.com/Helldez/BigMoeOnEdge.git

jobs:
  # ------------------------------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
      - name: App version, and that it matches the tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          V="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$PROJECT_ROOT/app/build.gradle.kts" | head -1)"
          test -n "$V" || { echo "could not read versionName" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "app versionName: $V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match versionName $V" >&2
            exit 1
          fi

  # ------------------------------------------------------------------------------------------------
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # With the three signing secrets the APK is signed with your stable key (so it updates in place over
      # the previous release). Without them it is signed with the runner's throwaway debug key, which is
      # fine for trying a build but cannot update an APK signed with another key (docs/SIGNING.md).
      - name: Signing key (when the secrets exist)
        id: sign
        shell: bash
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$BMOE_KEYSTORE_BASE64" ] && [ -n "$BMOE_KEYSTORE_PASSWORD" ] && [ -n "$BMOE_KEY_ALIAS" ]; then
            KS="$RUNNER_TEMP/bmoe-release.jks"
            printf '%s' "$BMOE_KEYSTORE_BASE64" | base64 -d > "$KS"
            chmod 600 "$KS"
            echo "BMOE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets: building with the throwaway debug key."
          fi

      # Reported, not gating: the app's unit-test source set did not compile in 0.6.5 (two test files carried
      # raw line breaks inside string literals), so a first run may show failures that are old. The APK below is built either way; the HTML report is uploaded to see them. Remove
      # `continue-on-error` once the suite is green and you want it to gate.
      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest

      - name: Unit test result
        if: steps.unit.outcome == 'failure'
        shell: bash
        run: echo "::warning title=Unit tests failed::The APK is still built. See the unit-test-report artifact for which tests failed."

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_ROOT }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK (arm64-v8a)
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
          BMOE_KEY_PASSWORD: ${{ secrets.BMOE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ steps.sign.outputs.stable }}" = "true" ]; then EXTRA="-PbmoeRequireStableSigning=true"; fi
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug $EXTRA

      - name: Name the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK not produced: $APK" >&2; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonedge-engine.so' || { echo "APK has no native engine" >&2; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/BigMoeOnEdge-plus-${{ needs.version.outputs.version }}-android-arm64-v8a.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS-android.txt

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "${BMOE_KEYSTORE_FILE:-/nonexistent}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------------
  # The same app with the Hexagon (Snapdragon NPU) prompt-prefill backend. Heavy: it pulls Qualcomm's
  # toolchain image and builds the engine plus four DSP skeletons, so a manual run can switch it off.
  # It replaces build-npu-fixed-3.yml; delete that file from .github/workflows or every push builds twice.
  android-npu:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.npu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: The NPU build scripts are in this source
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/build-hexagon-onedge-engine.sh scripts/verify-npu-payload.sh; do
            test -f "$PROJECT_ROOT/$f" || { echo "ERROR: source does not contain $f" >&2; exit 1; }
          done

      # The Hexagon SDK image, the native build tree and the Android NDK together can exhaust a hosted
      # runner's free disk, so the space is reclaimed first and the job refuses to start without 8 GB.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker system prune --all --force --volumes || true
          echo "Disk after cleanup:"
          df -h /
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$AVAIL_KB" -lt 8000000 ]; then
            echo "ERROR: less than 8 GB free after cleanup; refusing a likely disk-exhausting build." >&2
            exit 1
          fi

      # Builds this app's libonedge-engine.so with the Hexagon backend, and the four HTP DSP skeletons
      # (v73, v75, v79, v81), inside Qualcomm's Snapdragon toolchain image. The script stages them under
      # app/src/main/jniLibs and app/src/main/assets/hexagon, which Gradle then packages as they are.
      - name: Build JNI engine and Hexagon DSP libraries
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/snapdragon-toolchain/arm64-android:v0.8'
          ABS_ROOT="$(cd "$PROJECT_ROOT" && pwd)"
          cleanup_native_space() {
            # Docker's default user creates root-owned CMake files on this bind mount.
            sudo rm -rf -- "$ABS_ROOT/build-hexagon-onedge" || true
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
            docker system prune --force --volumes >/dev/null 2>&1 || true
            echo "Disk at native-build exit:"
            df -h / || true
          }
          trap cleanup_native_space EXIT
          docker run --rm \
            -e OUT=/workspace/build-hexagon-onedge \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -v "$ABS_ROOT:/workspace" \
            "$IMAGE" bash /workspace/scripts/build-hexagon-onedge-engine.sh
          echo "Disk after native build:"
          df -h /

      - name: Verify staged NPU libraries
        shell: bash
        run: |
          set -euo pipefail
          bash "$PROJECT_ROOT/scripts/verify-npu-payload.sh" \
            "$PROJECT_ROOT/app/src/main/jniLibs/arm64-v8a" \
            "$PROJECT_ROOT/app/src/main/assets/hexagon" | tee npu-payload-verification.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          df -h /

      # Same rule as the CPU job: your stable key when the three secrets exist, otherwise the runner's
      # throwaway debug key (which cannot update an APK signed with another key).
      - name: Signing key (when the secrets exist)
        id: sign
        shell: bash
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$BMOE_KEYSTORE_BASE64" ] && [ -n "$BMOE_KEYSTORE_PASSWORD" ] && [ -n "$BMOE_KEY_ALIAS" ]; then
            KS="$RUNNER_TEMP/bmoe-release.jks"
            printf '%s' "$BMOE_KEYSTORE_BASE64" | base64 -d > "$KS"
            chmod 600 "$KS"
            echo "BMOE_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets: building with the throwaway debug key."
          fi

      # -PbmoePrebuiltNative=true: Gradle packages the libraries staged above instead of compiling its own.
      - name: Build NPU-enabled APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
          BMOE_KEY_PASSWORD: ${{ secrets.BMOE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          EXTRA=""
          if [ "${{ steps.sign.outputs.stable }}" = "true" ]; then EXTRA="-PbmoeRequireStableSigning=true"; fi
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleDebug -PbmoePrebuiltNative=true $EXTRA
          df -h /

      - name: Verify the packaged APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERROR: APK not produced: $APK" >&2; exit 1; }
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/jni" "$TMP/hexagon"
          for f in libonedge-engine.so libc++_shared.so; do
            unzip -p "$APK" "lib/arm64-v8a/$f" > "$TMP/jni/$f" || { echo "ERROR: APK is missing lib/arm64-v8a/$f" >&2; exit 1; }
          done
          for f in libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -p "$APK" "assets/hexagon/$f" > "$TMP/hexagon/$f" || { echo "ERROR: APK is missing assets/hexagon/$f" >&2; exit 1; }
          done
          bash "$PROJECT_ROOT/scripts/verify-npu-payload.sh" "$TMP/jni" "$TMP/hexagon" | tee -a npu-payload-verification.txt
          sha256sum "$APK" | tee -a npu-payload-verification.txt

      - name: Verify APK signing certificate
        shell: bash
        env:
          BMOE_EXPECTED_CERT_SHA256: ${{ secrets.BMOE_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a npu-payload-verification.txt
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL" || { echo "ERROR: could not read the signing certificate" >&2; exit 1; }
          # The throwaway key an early CI (v0.5.5) used: an APK signed with it can never update a release-signed one.
          if [ "$ACTUAL" = "bac3895da611bae70c470e1a837077e50bb6db4e9f86bcf267c430634885beb1" ]; then
            echo "ERROR: APK is signed with the old throwaway CI debug certificate (the v0.5.5 one)." >&2; exit 1
          fi
          if [ -n "${BMOE_EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED="$(printf '%s' "$BMOE_EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: certificate $ACTUAL != expected $EXPECTED" >&2; exit 1; }
          fi
          echo "Signing certificate SHA-256: $ACTUAL" | tee -a npu-payload-verification.txt

      - name: Name the APK
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" "dist/BigMoeOnEdge-plus-$V-android-arm64-v8a-npu.apk"
          cp npu-payload-verification.txt "dist/npu-payload-verification-$V.txt"
          ls -l dist

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "${BMOE_KEYSTORE_FILE:-/nonexistent}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-npu-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------------
  core-host:
    name: core-host (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64,   experimental: false }
          - { os: ubuntu-24.04-arm, target: linux-aarch64,  experimental: false }
          - { os: macos-14,         target: macos-arm64,    experimental: false }
          # Windows is experimental here: upstream's own CI only compile-checks its Win32 I/O paths and
          # does not run these tests there, so a failing test may be a test that never ran on Windows.
          - { os: windows-2022,     target: windows-x86_64, experimental: true }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
      - name: Configure
        shell: bash
        run: cmake -S "$PROJECT_ROOT/ci/core-host" -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build-host --config Release -j 2
      - name: Tests
        shell: bash
        run: ctest --test-dir build-host -C Release --output-on-failure

  # ------------------------------------------------------------------------------------------------
  desktop:
    name: desktop (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 / 24.04 as upstream's release builds: the oldest image that can build a target sets the
          # oldest distribution its binaries run on. aarch64 needs gcc-14 for the newest ARM CPU tier.
          - { os: ubuntu-22.04,     target: linux-x86_64,   experimental: false, cmake_extra: "-G Ninja" }
          - { os: ubuntu-24.04-arm, target: linux-aarch64,  experimental: false, cmake_extra: "-G Ninja" }
          - { os: macos-14,         target: macos-arm64,    experimental: false, cmake_extra: "-G Ninja" }
          - { os: macos-15-intel,   target: macos-x86_64,   experimental: true,  cmake_extra: "-G Ninja" }
          - { os: windows-2022,     target: windows-x86_64, experimental: false, cmake_extra: "-G Ninja" }
          # Natively on an ARM64 runner, with upstream's clang toolchain file. Experimental: upstream also
          # builds its OpenCL and Vulkan modules here; this CPU-only build has not been run by anyone.
          - { os: windows-11-arm,   target: windows-arm64,  experimental: true,  cmake_extra: '-G "Ninja Multi-Config" -DCMAKE_TOOLCHAIN_FILE=third_party/llama.cpp/cmake/arm64-windows-llvm.cmake' }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Is upstream/ here?
        shell: bash
        run: |
          test -f "$PROJECT_ROOT/upstream/CMakeLists.txt" || { echo "upstream/ is missing from this source; the desktop jobs need it" >&2; exit 1; }

      - name: Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # WebKitGTK and the indicator library are bmoe-desktop's window.
          sudo apt-get install -y -q ninja-build libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          if [ "${{ matrix.target }}" = linux-aarch64 ]; then
            sudo apt-get install -y -q gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"; echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja

      - name: The MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}".StartsWith("windows-arm64")) { "arm64" } else { "x64" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch >nul && set" | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])" }
          }

      # The submodules are not in the zip (upstream/FORK_NOTE.md). Take them from the upstream tag, so
      # the llama.cpp commit is the one upstream built and tested that release with.
      - name: Fetch upstream's submodules (llama.cpp, webview)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_REF" --recurse-submodules --shallow-submodules \
            "$UPSTREAM_REPO" "$RUNNER_TEMP/up"
          for m in llama.cpp webview; do
            rm -rf "$PROJECT_ROOT/upstream/third_party/$m"
            cp -r "$RUNNER_TEMP/up/third_party/$m" "$PROJECT_ROOT/upstream/third_party/$m"
          done
          echo "llama.cpp pin: $(git -C "$RUNNER_TEMP/up/third_party/llama.cpp" rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the web UI
        shell: bash
        run: cd "$PROJECT_ROOT/upstream/ui" && npm ci && npm run build

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/upstream"
          cmake -S . -B build ${{ matrix.cmake_extra }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBMOE_BUILD_TESTS=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 2 --target bmoe-cli bmoe-server bmoe-server-assets bmoe-desktop

      - name: Smoke (--version)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/upstream"
          WB=build/bin/Release; [ -d "$WB" ] || WB=build/bin
          EXE=""; [ "${{ runner.os }}" != "Windows" ] || EXE=".exe"
          "$WB/bmoe-cli$EXE" --version
          "$WB/bmoe-server$EXE" --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/upstream"
          WB=build/bin/Release; [ -d "$WB" ] || WB=build/bin
          NAME="bmoe-desktop-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          PY="$(command -v python3 || command -v python)"
          mkdir -p "$RUNNER_TEMP/pkg/$NAME" "$GITHUB_WORKSPACE/dist"
          D="$RUNNER_TEMP/pkg/$NAME"
          # Everything the build put beside the executables: the engine's libraries and one module per
          # ggml backend, which ggml finds next to the program at start-up.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$WB"/*.exe "$WB"/*.dll "$D/"
            # The C++ runtime, so a machine without the redistributable still starts the programs.
            VS="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products "*" -property installationPath)"
            ARCH=x64; case "${{ matrix.target }}" in windows-arm64*) ARCH=arm64 ;; esac
            CRT="$(ls -d "$(cygpath -u "$VS")"/VC/Redist/MSVC/*/$ARCH/Microsoft.VC*.CRT | sort | tail -1)"
            cp "$CRT"/msvcp140*.dll "$CRT"/vcruntime140*.dll "$D/"
            if [ "$ARCH" = arm64 ]; then rm -f "$D/vcruntime140_1.dll"; fi
          else
            for f in bmoe-cli bmoe-server bmoe-desktop; do [ ! -e "build/bin/$f" ] || cp "build/bin/$f" "$D/"; done
            cp -P build/bin/*.so* "$D/" 2>/dev/null || true
            cp -P build/bin/*.dylib "$D/" 2>/dev/null || true
          fi
          ls "$D" | grep -q 'ggml-cpu' || { echo "no CPU backend module in the package" >&2; ls "$D"; exit 1; }
          cp LICENSE THIRD_PARTY_LICENSES "$D/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$RUNNER_TEMP/pkg" && "$PY" -m zipfile -c "$GITHUB_WORKSPACE/dist/$NAME.zip" "$NAME")
          else
            tar -C "$RUNNER_TEMP/pkg" -czf "$GITHUB_WORKSPACE/dist/$NAME.tar.gz" "$NAME"
          fi
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.android.result == 'success'
    needs: [version, android, android-npu, core-host, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Finds the project: unpacked at the repository root, or shipped as exactly one source .zip there
      # (any name). A zipped project is moved to ./project/root so its path has no spaces (the zip's own
      # folder is called "BigMoeOnEdge plus 0.x.y"), which NDK/CMake builds do not always survive.
      # Written without mapfile so it also runs on macOS's bash 3.2. The convention the old NPU workflow used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -d app ]; then
            ROOT="."
          else
            ZIPS="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'logs_*.zip' ! -name '*artifact*' | sort)"
            COUNT="$(printf '%s\n' "$ZIPS" | grep -c . || true)"
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected the project at the repository root or exactly one source ZIP there; found $COUNT:" >&2
              printf '%s\n' "$ZIPS" >&2
              exit 1
            fi
            echo "Source ZIP: $ZIPS"
            PY="$(command -v python3 || command -v python)"
            mkdir -p project/unzipped
            "$PY" -m zipfile -e "$ZIPS" project/unzipped
            # The app's root: the shallowest directory holding both gradlew and app/build.gradle.kts. (Not just
            # the first gradlew: upstream/examples/android has one of its own.)
            SRC=""
            find project/unzipped -maxdepth 6 -type f -name gradlew | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2- > "$RUNNER_TEMP/gradlews.txt"
            while IFS= read -r W; do
              D="$(dirname "$W")"
              if [ -f "$D/app/build.gradle.kts" ] || [ -f "$D/app/build.gradle" ]; then SRC="$D"; break; fi
            done < "$RUNNER_TEMP/gradlews.txt"
            test -n "$SRC" || { echo "ERROR: no gradlew with an app/ module in the source ZIP" >&2; exit 1; }
            mv "$SRC" project/root
            ROOT="project/root"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' -o -name '*.zip' -o -name 'npu-payload-verification-*.txt' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
          V="${{ needs.version.outputs.version }}"
          if [ -f "$PROJECT_ROOT/docs/RELEASE_NOTES_$V.md" ]; then cp "$PROJECT_ROOT/docs/RELEASE_NOTES_$V.md" notes.md; else echo "BigMoeOnEdge+ $V" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: BigMoeOnEdge+ ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true
