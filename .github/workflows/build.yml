
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and unzip project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project

          ZIP_FILE="BigMoeOnEdge-plus-0.4.5-performance-parity-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            mapfile -t ZIPS < <(
              find . -maxdepth 1 -type f -name '*.zip' \
                ! -name '*patch*' | sort
            )

            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "ERROR: Could not identify one project ZIP."
              echo "ZIP files found:"
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi

            ZIP_FILE="${ZIPS[0]}"
          fi

          echo "Using project archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          rm -rf project/.git

          WRAPPER="$(find project -maxdepth 6 -type f \
            -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$WRAPPER")"
          echo "GRADLE_DIR=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKM" --licenses >/dev/null || true

          "$SDKM" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

          installed=false
          for attempt in 1 2 3; do
            if "$SDKM" "ndk;27.0.12077973"; then
              installed=true
              break
            fi

            echo "NDK installation attempt $attempt failed."
            sleep 10
          done

          if [ "$installed" != true ]; then
            echo "ERROR: Android NDK installation failed."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BigMoeOnEdge-plus-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
